<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryArt · Уточнение пола</title>
<style>
:root{color-scheme:dark;--bg:#111419;--panel:#1b2028;--muted:#a3acbd;--line:#343c49;--accent:#a8dbad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef1f5;font:15px/1.5 system-ui}header{position:sticky;top:0;z-index:3;background:#111419f5;border-bottom:1px solid var(--line);padding:18px 4vw}.top,.controls,.pager{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}h1{font:600 23px/1.2 system-ui;margin:4px 0}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent)}p{margin:10px 0;color:var(--muted)}button,select,input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--panel);color:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}.primary,button[aria-pressed=true]{background:var(--accent);color:#14251b;border-color:var(--accent)}.controls{justify-content:flex-start;margin-top:14px}input{min-width:210px}main{max-width:1450px;margin:auto;padding:24px 4vw}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.image{height:350px;background:#fafafa;width:100%;object-fit:contain;display:block;cursor:zoom-in}.content{padding:15px}.id{font:12px ui-monospace;color:var(--muted)}h2{font-size:16px;margin:7px 0}.slot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.locator{font-size:13px;color:var(--muted);margin-bottom:8px}.choices{display:flex;gap:6px;flex-wrap:wrap}.choices button{font-size:13px;padding:7px 9px}.bad{color:#ffc0aa;font-size:13px}.known{font-size:12px;color:var(--muted)}.pager{padding:20px 0}.progress{height:4px;background:var(--line);margin-top:14px;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}#save-status{font-size:13px;color:var(--accent)}#error{color:#ffc0aa;white-space:pre-wrap}dialog{background:var(--bg);border:1px solid var(--line);color:inherit;max-width:96vw;max-height:96vh;padding:14px;border-radius:12px}dialog::backdrop{background:#000c}dialog img{display:block;max-width:none;width:900px;height:1200px}dialog .dialog-top{position:sticky;top:-14px;background:var(--bg);display:flex;justify-content:space-between;padding:10px 0}.empty{padding:60px;text-align:center;color:var(--muted)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:1fr}.image{height:400px}header{position:static}.top{align-items:flex-start}}
.grid{display:block}.pose-group{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:26px;background:#151a21}.group-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}.group-head h2{font-size:21px}.group-choices{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0 18px}.group-choice-label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.views .image{height:310px}.view-title{font-weight:600;margin-bottom:6px}@media(max-width:1000px){.views{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.views{grid-template-columns:1fr}.pose-group{padding:12px}}
</style></head><body>
<header><div class="top"><div><div class="eyebrow">STORYART / РЕФЕРЕНСЫ</div><h1>Вы определяете пол</h1></div><div><span id="save-status" role="status">Загрузка…</span> <button id="finish" class="primary" disabled>Завершить разметку</button></div></div>
<p>Ракурсы одной позы собраны вместе. Можно выбрать пол для всей группы или отдельно для каждого изображения. Нейтральный референс подходит обоим полам. Нажмите на изображение для просмотра оригинала.</p>
<div class="controls"><label>Показать <select id="filter"><option value="pending">Без ответа</option><option value="all">Все</option><option value="answered">С ответом</option></select></label><label>Тип <select id="kind"><option value="">Все</option><option value="single">Один участник</option><option value="multi">Несколько участников</option></select></label><input id="query" type="search" placeholder="Название или номер позы" aria-label="Поиск"><button id="export">Скачать ответы</button><strong id="count"></strong></div><div class="progress"><span id="bar"></span></div><div id="error" role="alert"></div></header>
<main><div class="pager"><button id="prev">← Назад</button><span id="page"></span><button id="next">Далее →</button></div><div id="cards" class="grid"></div><div class="pager"><button id="prev-bottom">← Назад</button><span id="page-bottom"></span><button id="next-bottom">Далее →</button></div></main>
<dialog id="zoom"><div class="dialog-top"><span id="zoom-title"></span><button id="close">Закрыть ×</button></div><img id="zoom-img" alt="Оригинал позы в полном разрешении"></dialog>
<script>
const token='__TOKEN__',labels={MALE:'Мужской',FEMALE:'Женский',NEUTRAL:'Нейтральный',EXCLUDE:'Не использовать'},$=id=>document.getElementById(id);let state,page=0,revision=0,queue=Promise.resolve(),saving=0;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const choice=(r,s)=>state.answers[r.id]?.choices[s.participant_id]||'';
const answered=r=>r.slots.every(s=>choice(r,s));
function grouped(){const groups=new Map();for(const r of state.items){if(!groups.has(r.group_id))groups.set(r.group_id,{id:r.group_id,title:r.title,items:[]});groups.get(r.group_id).items.push(r)}return [...groups.values()]}
function filtered(){const q=$('query').value.toLowerCase();return grouped().filter(g=>(!q||g.items.some(r=>(r.id+' '+r.title).toLowerCase().includes(q)))&&($('filter').value==='all'||g.items.every(answered)===($('filter').value==='answered'))&&(!$('kind').value||Boolean(g.items[0].participants.length)===($('kind').value==='multi')))}
const angleNames={front:'Спереди',side:'Сбоку',three_quarter:'¾'},styleNames={'3d':'3D','line':'Контур'};
function imageCard(r){return `<article class="card"><img class="image" src="/image/${r.id}" alt="${esc(r.title)} — ${angleNames[r.angle]}" data-zoom="${r.id}" loading="lazy"><div class="content"><div class="view-title">${styleNames[r.representation]} · ${angleNames[r.angle]}</div><div class="id">${r.id}</div>${r.anatomy!=='PASS'?'<div class="bad">Есть анатомический дефект: выбор пола не снимает этот отказ.</div>':''}${r.participants.filter(p=>p.subject_label!=='UNKNOWN').map(p=>`<div class="known">${p.participant_id}: ${esc(p.locator)} — ${labels[p.subject_label]}</div>`).join('')}${r.slots.map(s=>`<section class="slot"><strong>${s.participant_id==='SUBJECT'?'Пол этого ракурса':'Участник '+esc(s.participant_id)}</strong><div class="locator">${esc(s.locator)}</div><div class="choices">${Object.entries(labels).map(([v,t])=>`<button data-id="${r.id}" data-slot="${s.participant_id}" data-value="${v}" aria-pressed="${choice(r,s)===v}">${t}</button>`).join('')}<button data-id="${r.id}" data-slot="${s.participant_id}" data-value="" aria-label="Сбросить выбор">↶</button></div></section>`).join('')}</div></article>`}
function groupCard(g){const slots=[...new Set(g.items.flatMap(r=>r.slots.map(s=>s.participant_id)))];return `<section class="pose-group" data-group-id="${g.id}"><div class="group-head"><h2>${esc(g.title)}</h2><span class="id">${g.id} · ${g.items.length} ракурсов</span></div><div class="group-choices">${slots.map(slot=>{const values=g.items.flatMap(r=>r.slots.filter(s=>s.participant_id===slot).map(s=>choice(r,s))),selected=values.every(v=>v===values[0])?values[0]:'';return `<div><span class="group-choice-label">${slot==='SUBJECT'?'Выбор для всех ракурсов':'Участник '+esc(slot)+' · все ракурсы'}</span><div class="choices">${Object.entries(labels).map(([v,t])=>`<button data-group="${g.id}" data-slot="${slot}" data-value="${v}" aria-pressed="${selected===v}">${t}</button>`).join('')}<button data-group="${g.id}" data-slot="${slot}" data-value="" aria-label="Сбросить выбор группы">↶</button></div></div>`}).join('')}</div><div class="views">${g.items.map(imageCard).join('')}</div></section>`}
function render(){const total=state.items.reduce((n,r)=>n+r.slots.length,0),done=state.items.reduce((n,r)=>n+r.slots.filter(s=>choice(r,s)).length,0),rows=filtered();page=Math.min(page,Math.max(0,Math.ceil(rows.length/3)-1));$('count').textContent=`${done} / ${total} ответов · ${grouped().length} групп · ${state.items.length} изображений`;$('bar').style.width=(100*done/Math.max(1,total))+'%';$('finish').disabled=done!==total||saving>0;for(const id of ['page','page-bottom'])$(id).textContent=rows.length?`${page+1} / ${Math.ceil(rows.length/3)} · групп: ${rows.length}`:'Нет групп';for(const id of ['prev','prev-bottom'])$(id).disabled=page===0;for(const id of ['next','next-bottom'])$(id).disabled=(page+1)*3>=rows.length;$('cards').innerHTML=rows.slice(page*3,page*3+3).map(groupCard).join('')||'<div class="empty">Все группы в этом разделе заполнены.</div>';}
function persist(finish=false){const answers=structuredClone(state.answers);saving++;$('save-status').textContent='Сохраняю…';render();queue=queue.then(async()=>{const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify({revision,answers,completed:finish})});const result=await response.json();if(!response.ok)throw Error(result.error||'Ошибка сохранения');revision=result.revision;state.revision=revision;state.completed=result.completed;$('save-status').textContent=finish?'Разметка завершена и сохранена':'Все изменения сохранены';$('error').textContent='';}).catch(e=>{$('error').textContent='Ответы не сохранены: '+e.message;}).finally(()=>{saving--;render()});}
$('cards').addEventListener('click',e=>{const b=e.target.closest('button[data-slot]');if(b){const rows=b.dataset.group?state.items.filter(r=>r.group_id===b.dataset.group&&r.slots.some(s=>s.participant_id===b.dataset.slot)):state.items.filter(r=>r.id===b.dataset.id);for(const r of rows){state.answers[r.id]??={sha256:r.sha256,choices:{}};if(b.dataset.value)state.answers[r.id].choices[b.dataset.slot]=b.dataset.value;else delete state.answers[r.id].choices[b.dataset.slot]}persist();return}const img=e.target.closest('[data-zoom]');if(img){$('zoom-title').textContent=img.dataset.zoom+' · 900 × 1200';$('zoom-img').src=img.src;$('zoom').showModal()}});
for(const id of ['filter','kind','query'])$(id).addEventListener('input',()=>{page=0;render()});for(const id of ['prev','prev-bottom'])$(id).onclick=()=>{page--;render();window.scrollTo(0,0)};for(const id of ['next','next-bottom'])$(id).onclick=()=>{page++;render();window.scrollTo(0,0)};$('close').onclick=()=>$('zoom').close();$('finish').onclick=()=>persist(true);$('export').onclick=async()=>{try{await queue;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='StoryArt-author-subject-choices.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch{}};
fetch('/api/state').then(r=>{if(!r.ok)throw Error('Не удалось загрузить разметку');return r.json()}).then(d=>{state=d;revision=d.revision;$('save-status').textContent=d.completed?'Разметка завершена и сохранена':'Ответы сохраняются автоматически';render()}).catch(e=>$('error').textContent=e.message);
</script></body></html>
